server {
  listen 80;
  server_name _;

  root   /usr/share/nginx/html;
  index  index.html;

  # Security headers
  add_header X-Content-Type-Options        "nosniff"                          always;
  add_header X-Frame-Options               "SAMEORIGIN"                       always;
  add_header X-XSS-Protection             "1; mode=block"                    always;
  add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
  add_header Permissions-Policy            "geolocation=(self), microphone=(), camera=()" always;
  add_header Strict-Transport-Security     "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.openstreetmap.org; connect-src 'self' https://edog.bg https://edog.dogpass.net https://api.edog.bg; frame-src 'none'; object-src 'none'; base-uri 'self';" always;

  # Serve static assets with correct MIME type
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Let React Router handle all other routes
  location / {
    try_files $uri /index.html;
  }
}
