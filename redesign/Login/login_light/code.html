<body class="min-h-screen flex flex-col font-body-md text-on-background">
<!-- Top Navigation Bar (Suppressed on Login according to Shell Visibility Rule, but we include identity) -->
<header class="w-full flex justify-center py-xl">
<div class="flex flex-col items-center">
<div class="mb-xs text-primary">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">eDog</h1>
</div>
</header>
<main class="flex-1 w-full max-w-[1280px] mx-auto px-margin-mobile flex flex-col justify-center pb-xl">
<div class="w-full max-w-md mx-auto space-y-lg">
<!-- Welcome Text -->
<div class="space-y-xs text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your pet's health journey.</p>
</div>
<!-- Login Form -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(26,28,30,0.04)] p-lg border border-outline-variant/30">
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/60">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low rounded-lg border-none focus:ring-2 focus:ring-primary transition-all text-on-surface font-body-md placeholder:text-outline" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/60">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-low rounded-lg border-none focus:ring-2 focus:ring-primary transition-all text-on-surface font-body-md placeholder:text-outline" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-on-surface-variant/60 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-sm hover:brightness-110 active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="submit">
                        Sign In
                    </button>
</form>
</div>
<!-- Divider -->
<div class="relative flex py-xs items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-on-surface-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-xs py-3 px-4 bg-surface-container-lowest border border-outline-variant rounded-full hover:bg-surface-container-low transition-colors active:scale-95">
<img alt="Apple" class="w-5 h-5" data-alt="A clean, minimalist vector of the Apple logo in solid black, centered against a transparent background to represent premium technology integration. The style is sharp and professional, fitting into a modern high-end user interface design with subtle depth and clean lines." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0nBfwjSGo754u67S-rTff36ORHOSjLIHgL6ne_go-Kw3ignapGmrXdi6Tn4tjan64H2w24tsg777exwTQDcSY9bVe5VoL1g_QYkgm8WRI-7E31Z6YgkuHrvOPJh42ENkmGdE4k79PF2wilg5YHIGqAR2Os_a6_2cf3Nh3fSnr-8LGIdKka7F4c6dAmDYwRTWUXkd9J74hv_9hWmmADFbAjcP2lMhh7T4C-u1S5vVrH9OZONoC9dwlYUdH8o3oWJoQPUOT_UZs1KVT"/>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
<button class="flex items-center justify-center gap-xs py-3 px-4 bg-surface-container-lowest border border-outline-variant rounded-full hover:bg-surface-container-low transition-colors active:scale-95">
<img alt="Google" class="w-5 h-5" data-alt="A high-quality rendering of the Google G icon with its signature four-color palette, displayed clearly on a neutral surface. The image represents modern connectivity and seamless web authentication within a clean-professional digital ecosystem characterized by soft lighting and professional aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtRl1qqM7zeSkvWZnTELHQuRX4yOIN1XzyUHMTcVXe7MHC_8tAIA4P06yGWoMLvoEZeMalGc0kmOfXXvJZTKizrBDO1G-q5LcgvYxHfXSnEeKI9dvAlE2IsUj1y5KoI05wPBX7i_mbJVv3oG94Aqk4aPmylMLnnRomKW6ern4TN1Nq_62XwHcvUhl8Y3ZVN0h3sWuehM6CcPwC5w2zAxYagp9vmjVgbkmj5gzPTtJ-hq4FpTQ-rdP2ca63HIGDMpE1LykNB4nPI8qk"/>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
</div>
<!-- Footer Link -->
<p class="text-center font-body-md text-body-md text-on-surface-variant pt-md">
                Don't have an account? 
                <a class="text-primary font-label-md text-label-md hover:underline ml-1" href="#">Sign up</a>
</p>
</div>
