<!DOCTYPE html>

<style>
        body {
            background-color: #111316;
            color: #e2e2e6;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .input-glow:focus-within {
            box-shadow: 0 0 0 2px #a4c9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Auth Container -->
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-xl flex flex-col items-center space-y-md">
<img alt="eDog Logo" class="w-20 h-20 object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida/ADBb0uhvN6DYdrflN4BXGXAFHmNEFMURaGCY2D9Q_EPWEXO90O2-g2atyQkbXSMglhdmDBTZ-4y8RqlViTOvSAdrVQ7ixIsWdI9GvJI5zYiFnYV3x2Mj7J5trxKcbv7Meg80eU8ZarVOqKreiTUv4sp7egCRuE8i9yRKgqnrrdEs76MjZczUIJU-mtrgj97bOL5NkSe8OBQyUb7N6YvF0m-432cduTC0bjlnKoyyEHSkcb5DD8Wkk1zgwa0wE_I"/>
<h1 class="font-headline-md text-headline-md text-primary font-extrabold tracking-tight">eDog</h1>
</div>
<!-- Headline -->
<div class="w-full mb-xl text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-unit">Hello, Pet Parent</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your pet's healthy lifestyle.</p>
</div>
<!-- Form Section -->
<form class="w-full space-y-lg">
<!-- Email Field -->
<div class="space-y-unit">
<label class="font-label-md text-label-md text-on-surface-variant ml-unit" for="email">Email</label>
<div class="relative flex items-center bg-surface-container-high rounded-xl border border-white/10 input-glow transition-all duration-200">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">mail</span>
<input class="w-full bg-transparent border-none text-on-surface font-body-md text-body-md py-md pl-12 pr-md focus:ring-0 placeholder:text-outline" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-unit">
<div class="flex justify-between items-center px-unit">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center bg-surface-container-high rounded-xl border border-white/10 input-glow transition-all duration-200">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">lock</span>
<input class="w-full bg-transparent border-none text-on-surface font-body-md text-body-md py-md pl-12 pr-12 focus:ring-0 placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md text-on-surface-variant" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-lg active:scale-[0.98] transition-all duration-200 font-bold" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-xl px-md">
<div class="flex-grow h-[1px] bg-white/10"></div>
<span class="px-md font-label-sm text-label-sm text-outline uppercase tracking-widest">OR</span>
<div class="flex-grow h-[1px] bg-white/10"></div>
</div>
<!-- Social Logins -->
<div class="w-full flex flex-col space-y-md">
<button class="w-full flex items-center justify-center space-x-md bg-surface-container-highest border border-white/5 py-4 rounded-xl hover:bg-surface-bright transition-colors active:scale-[0.98] duration-200">
<span class="material-symbols-outlined text-on-surface">HandPalm</span>
<span class="font-label-md text-label-md text-on-surface">Continue with Apple</span>
</button>
<button class="w-full flex items-center justify-center space-x-md bg-surface-container-highest border border-white/5 py-4 rounded-xl hover:bg-surface-bright transition-colors active:scale-[0.98] duration-200">
<span class="material-symbols-outlined text-on-surface">google</span>
<span class="font-label-md text-label-md text-on-surface">Continue with Google</span>
</button>
</div>
<!-- Footer -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed top-0 right-0 -z-10 w-[500px] h-[500px] opacity-10 blur-[120px] rounded-full bg-primary pointer-events-none translate-x-1/2 -translate-y-1/2"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[400px] h-[400px] opacity-5 blur-[100px] rounded-full bg-tertiary pointer-events-none -translate-x-1/2 translate-y-1/2"></div>
</body></html>
