<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top Navigation (Shell Rule: Suppressed for Transactional screen, showing minimal logo only) -->
<header class="w-full flex justify-center pt-xl pb-md">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="pets">pets</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">eDog</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile">
<div class="w-full max-w-[440px] bg-white rounded-xl shadow-[0px_4px_20px_rgba(26,28,30,0.04)] p-lg md:p-xl">
<!-- Welcome Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Join eDog</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your account and start your pet care journey today.</p>
</div>
<!-- Signup Form -->
<form action="#" class="space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="name">Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-3 bg-[#f3f0ee] border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-md text-body-md placeholder:text-outline" id="name" placeholder="Enter your full name" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-[#f3f0ee] border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-md text-body-md placeholder:text-outline" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-[#f3f0ee] border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-md text-body-md placeholder:text-outline" id="password" placeholder="Create a password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg shadow-sm hover:bg-primary-container active:scale-[0.98] transition-all cursor-pointer" type="submit">
                        Create Account
                    </button>
</div>
</form>
<!-- Divider -->
<div class="flex items-center my-xl">
<div class="flex-grow h-[1px] bg-outline-variant"></div>
<span class="px-sm font-label-sm text-label-sm text-outline-variant">OR SIGN UP WITH</span>
<div class="flex-grow h-[1px] bg-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-xs py-3 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95">

<span class="material-symbols-outlined text-[20px]" data-icon="apple" data-weight="fill" style="font-variation-settings: 'FILL' 1;">File</span>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
