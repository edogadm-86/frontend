</div>
<div class="flex items-center gap-md">

<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high border border-outline-variant">

<p class="font-body-md text-body-md text-on-surface-variant">Manage your pet's health and daily routine.</p>
</section>
<section class="grid grid-cols-1 gap-lg">

<div class="relative h-48 w-full">

<span class="px-sm py-1 bg-primary-container/20 text-primary-fixed rounded-full font-label-sm text-label-sm backdrop-blur-md border border-primary/30">Active</span>
</div>
</div>
<div class="p-lg flex flex-col gap-md">
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Cooper</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Golden Retriever • 3 Years</p>
</div>
<div class="p-sm bg-surface-container-high rounded-full">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
</div>
<div class="flex flex-wrap gap-sm">
<div class="flex items-center gap-xs px-sm py-1 bg-surface-container-highest rounded-lg border border-outline-variant">
<span class="material-symbols-outlined text-[16px] text-tertiary">medical_services</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Vax Due</span>
</div>
<div class="flex items-center gap-xs px-sm py-1 bg-surface-container-highest rounded-lg border border-outline-variant">
<span class="material-symbols-outlined text-[16px] text-primary">fitness_center</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">80% Goal</span>
</div>
</div>
<button class="w-full py-md bg-primary text-on-primary rounded-xl font-label-md text-label-md hover:bg-primary-container transition-colors active:scale-95 duration-200 flex items-center justify-center gap-sm">

</button>
</div>
</div>

</div>
</div>
<div class="p-lg flex flex-col gap-md">
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Bella</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Beagle • 2 Years</p>
</div>
<div class="p-sm bg-surface-container-high rounded-full">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">pets</span>

</button>
</div>
</div>
<!-- Add New Pet -->
<div class="border-2 border-dashed border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center gap-md bg-surface-container-lowest/50 hover:bg-surface-container-low transition-colors group cursor-pointer">
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[32px]">add</span>
</div>
<div class="text-center">
<h3 class="font-label-md text-label-md text-on-surface">Add New Pet</h3>
